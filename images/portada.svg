<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">UD1 · Arquitecturas y tecnologías web en el cliente</title>
  <desc id="d">Portada de la unidad 1 del módulo Desarrollo Web en Entorno Cliente: un navegador y un servidor intercambian una petición y una respuesta.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7df1e"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7df1e"/>
    </marker>
    <marker id="flecha2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fd6ff"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#fondo)"/>
  <!-- Retícula decorativa -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200M0 300H1200M0 350H1200"/>
    <path d="M100 0V400M200 0V400M300 0V400M400 0V400M500 0V400M600 0V400M700 0V400M800 0V400M900 0V400M1000 0V400M1100 0V400"/>
  </g>

  <!-- Texto -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="60" y="80" fill="#c9c3e6" font-size="22" letter-spacing="3">DESARROLLO WEB EN ENTORNO CLIENTE · 2DAW</text>
    <rect x="60" y="100" width="120" height="6" rx="3" fill="url(#acento)"/>
    <text x="60" y="185" fill="#ffffff" font-size="64" font-weight="700">UD1</text>
    <text x="60" y="240" fill="#ffffff" font-size="34" font-weight="600">Arquitecturas y tecnologías</text>
    <text x="60" y="282" fill="#ffffff" font-size="34" font-weight="600">web en el cliente</text>
    <text x="60" y="340" fill="#f7df1e" font-size="22" font-weight="600">RA1 · Selecciona arquitecturas y tecnologías</text>
  </g>

  <!-- Navegador -->
  <g transform="translate(640,95)">
    <rect width="250" height="190" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#c9c3e6" stroke-width="2"/>
    <rect width="250" height="34" rx="12" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="6" fill="#febc2e"/>
    <circle cx="60" cy="17" r="6" fill="#28c840"/>
    <rect x="80" y="9" width="155" height="16" rx="8" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="20" y="52" width="130" height="12" rx="6" fill="#c9c3e6" fill-opacity="0.6"/>
    <rect x="20" y="74" width="210" height="8" rx="4" fill="#c9c3e6" fill-opacity="0.3"/>
    <rect x="20" y="90" width="180" height="8" rx="4" fill="#c9c3e6" fill-opacity="0.3"/>
    <rect x="20" y="118" width="64" height="52" rx="8" fill="#f7df1e"/>
    <text x="52" y="156" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="700" fill="#1b1f3b">JS</text>
    <rect x="98" y="118" width="132" height="52" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#7fd6ff" stroke-dasharray="4 4"/>
    <text x="164" y="149" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#7fd6ff">&lt;html&gt;</text>
    <text x="125" y="215" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="18" fill="#c9c3e6">Cliente</text>
  </g>

  <!-- Servidor -->
  <g transform="translate(1010,110)">
    <rect width="130" height="46" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#c9c3e6" stroke-width="2"/>
    <rect y="56" width="130" height="46" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#c9c3e6" stroke-width="2"/>
    <rect y="112" width="130" height="46" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#c9c3e6" stroke-width="2"/>
    <circle cx="110" cy="23" r="5" fill="#28c840"/>
    <circle cx="110" cy="79" r="5" fill="#28c840"/>
    <circle cx="110" cy="135" r="5" fill="#febc2e"/>
    <rect x="16" y="19" width="60" height="8" rx="4" fill="#c9c3e6" fill-opacity="0.4"/>
    <rect x="16" y="75" width="60" height="8" rx="4" fill="#c9c3e6" fill-opacity="0.4"/>
    <rect x="16" y="131" width="60" height="8" rx="4" fill="#c9c3e6" fill-opacity="0.4"/>
    <text x="65" y="200" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="18" fill="#c9c3e6">Servidor</text>
  </g>

  <!-- Petición y respuesta -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <path d="M900 150 H1000" stroke="#f7df1e" stroke-width="3" marker-end="url(#flecha)"/>
    <text x="950" y="140" text-anchor="middle" fill="#f7df1e">GET</text>
    <path d="M1000 230 H900" stroke="#7fd6ff" stroke-width="3" marker-end="url(#flecha2)"/>
    <text x="950" y="256" text-anchor="middle" fill="#7fd6ff">200 OK</text>
  </g>
</svg>
