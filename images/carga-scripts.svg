<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Carga de un script según sus atributos</title>
  <desc id="d">Comparación en el tiempo de un script normal, uno con async, uno con defer y un módulo. El script normal detiene el análisis del HTML mientras se descarga y se ejecuta. Async descarga en paralelo y detiene el análisis solo al ejecutarse. Defer y los módulos descargan en paralelo y se ejecutan al terminar de leer el HTML.</desc>
  <style>
    .t  { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1b1f3b; }
    .tt { font-size: 20px; font-weight: 700; }
    .fila { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; fill: #555c7a; }
    .ley { font-size: 14px; }
    .parser { fill: #4caf7a; }
    .pausa  { fill: #ffffff; stroke: #4caf7a; stroke-width: 2; stroke-dasharray: 5 4; }
    .desc   { fill: #4a90d9; }
    .ejec   { fill: #e0533d; }
  </style>

  <rect width="960" height="470" rx="16" fill="#ffffff"/>
  <text x="30" y="40" class="t tt">Carga de un script según sus atributos</text>

  <!-- Eje de tiempo -->
  <line x1="230" y1="400" x2="920" y2="400" stroke="#555c7a" stroke-width="2"/>
  <path d="M920 400 l-10 -5 v10 z" fill="#555c7a"/>
  <text x="880" y="422" class="t sub">tiempo →</text>

  <!-- Fila: normal -->
  <text x="30" y="92" class="t fila">&lt;script&gt;</text>
  <text x="30" y="110" class="t sub">normal</text>
  <rect x="230" y="75" width="180" height="26" rx="4" class="parser"/>
  <rect x="410" y="75" width="230" height="26" rx="4" class="pausa"/>
  <rect x="640" y="75" width="270" height="26" rx="4" class="parser"/>
  <rect x="410" y="106" width="150" height="16" rx="3" class="desc"/>
  <rect x="560" y="106" width="80" height="16" rx="3" class="ejec"/>
  <text x="525" y="93" text-anchor="middle" class="t sub">parser detenido</text>

  <!-- Fila: async -->
  <text x="30" y="182" class="t fila">async</text>
  <text x="30" y="200" class="t sub">ejecuta al llegar, sin orden</text>
  <rect x="230" y="165" width="330" height="26" rx="4" class="parser"/>
  <rect x="560" y="165" width="80" height="26" rx="4" class="pausa"/>
  <rect x="640" y="165" width="120" height="26" rx="4" class="parser"/>
  <rect x="410" y="196" width="150" height="16" rx="3" class="desc"/>
  <rect x="560" y="196" width="80" height="16" rx="3" class="ejec"/>

  <!-- Fila: defer -->
  <text x="30" y="272" class="t fila">defer</text>
  <text x="30" y="290" class="t sub">ejecuta al final, en orden</text>
  <rect x="230" y="255" width="450" height="26" rx="4" class="parser"/>
  <rect x="410" y="286" width="150" height="16" rx="3" class="desc"/>
  <rect x="680" y="286" width="80" height="16" rx="3" class="ejec"/>

  <!-- Fila: module -->
  <text x="30" y="352" class="t fila">type="module"</text>
  <text x="30" y="370" class="t sub">como defer (y sus import)</text>
  <rect x="230" y="335" width="450" height="26" rx="4" class="parser"/>
  <rect x="410" y="366" width="110" height="16" rx="3" class="desc"/>
  <rect x="520" y="366" width="70" height="16" rx="3" class="desc" opacity="0.6"/>
  <rect x="680" y="366" width="80" height="16" rx="3" class="ejec"/>

  <!-- Marca: HTML leído entero -->
  <line x1="680" y1="240" x2="680" y2="395" stroke="#1b1f3b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="686" y="250" class="t sub">HTML leído entero:</text>
  <text x="686" y="264" class="t sub">se ejecutan defer y módulos</text>

  <!-- Leyenda -->
  <g transform="translate(230,435)">
    <rect width="26" height="14" rx="3" class="parser"/>
    <text x="34" y="12" class="t ley">Parser HTML trabajando</text>
    <rect x="210" width="26" height="14" rx="3" class="pausa"/>
    <text x="244" y="12" class="t ley">Parser detenido</text>
    <rect x="380" width="26" height="14" rx="3" class="desc"/>
    <text x="414" y="12" class="t ley">Descarga</text>
    <rect x="510" width="26" height="14" rx="3" class="ejec"/>
    <text x="544" y="12" class="t ley">Ejecución</text>
  </g>
</svg>
